[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps",
  "cd backend && npx prisma generate"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && npm run build"
]

[start]
cmd = "BACKEND_PORT=5000 npm run start:backend & sleep 5 && PORT=8080 npm run start:frontend"
