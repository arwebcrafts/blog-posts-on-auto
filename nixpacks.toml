[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps",
  "cd backend && npx prisma generate"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && npm run build"
]

[start]
cmd = "cd backend && npx prisma db push --accept-data-loss --skip-generate && cd .. && (cd frontend && PORT=8080 npm start &) && cd backend && BACKEND_PORT=5000 npm start"
