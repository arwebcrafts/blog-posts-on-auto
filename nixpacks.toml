[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps",
  "cd backend && npx prisma generate"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && npm run build"
]

[phases.deploy]
cmds = [
  "cd backend && npx prisma db push --accept-data-loss --skip-generate"
]

[start]
cmd = "npm start"
